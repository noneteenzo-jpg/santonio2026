<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro De Usuario</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="Container">
        <h1>Cadastro de Usuário</h1>
        <p class="subtitle">preencha os dado abaixo para realizar seu cadastro</p>
        <form>

            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>
            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>
            </div>
            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            <div class="campo">
                <label for="Data">Data de nascimento:</label>
                <input type="date" id="data" name="data" required>
            </div>
            <div class="campo">
                <label>Gênero</label>
                <div class="generox">
                    <label class="genero">
                        <input type="radio" name="genero" value="masculino" class="genero">
                        Masculino
                    </label>
                    <label class="genero">
                        <input type="radio" name="genero" value="feminino" class="genero">
                        Feminino
                    </label>
                    <label class="genero">
                        <input type="radio" name="genero" value="outro" class="genero">
                        Outro
                    </label>
                </div>
            </div>
            <div class="campo">
                <label for="cidade">Cidade:</label>
                <select name="cidade" id="cidade">
                    <option value="">Selecione uma cidade</option>
                    <option value="curitiba">Curitiba</option>
                    <option value="londrina">Londrina</option>
                    <option value="maringa">Maringá</option>
                    <option value="ponta-grossa">Ponta Grossa</option>
                </select>
            </div>

            <div class="termos">
                
                <input type="checkbox" id="termos" name="termos" required class="termos">
                <label for="termos">Aceito os termos de uso.</label>
                
            </div>

            <div class="butao">
                <button type="submit">Cadastrar</button>

            </div>
    </div>
    </form>

</body>

</html>
