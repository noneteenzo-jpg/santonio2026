<!DOCTYPE html> <!-- Informa ao navegador que este documento segue o padrão moderno do HTML5. -->
<html lang="PT-BR"> <!-- É a tag raiz do documento. O atributo 'lang' indica que o idioma do conteúdo é o Português do Brasil. -->
<head> <!-- Guarda os metadados e configurações da página (informações que não aparecem diretamente na tela). -->
    <meta charset="UTF-8"> <!-- Define o conjunto de caracteres como UTF-8, garantindo suporte correto a acentos, ç e símbolos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Torna o site responsivo em celulares e tablets, ajustando a largura à tela do aparelho. -->
    <title>Document</title> <!-- Define o título que aparece na aba do navegador ou nos resultados de busca. -->
</head> <!-- Encerra o cabeçalho de configurações. -->
<body> <!-- Início do corpo da página, onde é inserido todo o conteúdo visível para o usuário (textos, imagens, botões). -->

</body> <!-- Encerra a área de conteúdo visível. -->
</html> <!-- Encerra o documento HTML. -->
